name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    # Release events fire for every tag, limit to target vX.Y.Z.
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        run: make release
